hostname: localhost
model: DeepSeek-V3-Lite/bf16
backend: pytorch
cuda_graph_config: null
disable_overlap_scheduler: true
speculative_config:
  decoding_type: MTP
  num_nextn_predict_layers: 1
context_servers:
  num_instances: 1
  max_batch_size: 4
  max_num_tokens: 1024
  max_seq_len: 1024
  enable_chunked_prefill: false
  kv_cache_config:
    enable_block_reuse: false
    enable_partial_reuse: false
    free_gpu_memory_fraction: 0.05
    max_tokens: 1024
    tokens_per_block: 64
  tensor_parallel_size: 2
  pipeline_parallel_size: 1
  cache_transceiver_config:
    backend: UCX
generation_servers:
  num_instances: 1
  max_batch_size: 4
  max_num_tokens: 1024
  max_seq_len: 1024
  tensor_parallel_size: 2
  pipeline_parallel_size: 1
  enable_chunked_prefill: false
  kv_cache_config:
    enable_block_reuse: false
    enable_partial_reuse: false
    free_gpu_memory_fraction: 0.05
    max_tokens: 1024
    tokens_per_block: 64
  cache_transceiver_config:
    backend: UCX
